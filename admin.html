<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>網站管理員後台</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #f1f5f9; color: #1e293b; margin: 0; line-height: 1.6; }
    .topbar { background: #0f172a; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
    .topbar a, .topbar button { color: #e2e8f0; background: none; border: 1px solid #334155; padding: 6px 14px; border-radius: 6px; text-decoration: none; cursor: pointer; font-size: 13px; }
    .auth-box { max-width: 420px; margin: 64px auto; background: #fff; padding: 32px; border-radius: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); }
    .auth-box h2 { margin-top: 0; font-size: 22px; }
    .dashboard { max-width: 920px; margin: 28px auto; padding: 0 20px; display: none; }
    .panel { background: #fff; padding: 24px; border-radius: 12px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .panel h3 { margin-top: 0; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #475569; }
    input[type="text"], input[type="password"], input[type="url"], select {
      width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 14px; font-family: inherit;
    }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row > div { flex: 1; min-width: 200px; }
    .btn { background: #2563eb; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-secondary { background: #64748b; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .tag-list { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .tag { background: #e0e7ff; color: #1e40af; padding: 5px 12px; border-radius: 16px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
    .tag button { background: none; border: none; color: #1e40af; font-weight: bold; cursor: pointer; padding: 0; font-size: 15px; }
    .post-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f1f5f9; gap: 12px; }
    .post-item:last-child { border-bottom: none; }
    .status { margin-top: 12px; font-size: 13px; font-weight: 500; }
    .link-switch { display: inline-block; margin-top: 14px; font-size: 13px; color: #2563eb; cursor: pointer; text-decoration: underline; }
    .toast { position: fixed; bottom: 20px; right: 20px; background: #0f172a; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 14px; display: none; z-index: 100; }

    /* 匿名小建議卡片樣式 */
    .sug-card { border: 1px solid #e2e8f0; background: #f8fafc; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .sug-card:last-child { margin-bottom: 0; }
    .sug-meta { font-size: 12px; color: #64748b; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .sug-badge { background: #fef3c7; color: #92400e; padding: 2px 8px; border-radius: 10px; font-weight: 600; font-size: 11px; }
    .sug-text { font-size: 14px; color: #1e293b; white-space: pre-line; word-break: break-word; }
    .sug-config-box { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 14px; margin-top: 14px; font-size: 13px; }
    .key-pill { font-family: monospace; background: #e2e8f0; padding: 4px 8px; border-radius: 5px; font-size: 12px; user-select: all; }

    /* Word 風格富文本編輯器 */
    .editor-wrapper { border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden; background: #fff; transition: border-color 0.2s; }
    .editor-wrapper.drag-over { border: 2px dashed #2563eb; background: #eff6ff; }
    .editor-toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px; background: #f8fafc; border-bottom: 1px solid #cbd5e1; align-items: center; }
    .tb-group { display: inline-flex; gap: 4px; padding-right: 8px; margin-right: 2px; border-right: 1px solid #cbd5e1; align-items: center; flex-wrap: wrap; }
    .tb-group:last-child { border-right: none; padding-right: 0; margin-right: 0; }
    .tb-label { font-size: 12px; color: #64748b; font-weight: 600; margin-right: 2px; }
    .tb-btn { background: #fff; border: 1px solid #cbd5e1; color: #1e293b; border-radius: 5px; padding: 4px 8px; font-size: 13px; cursor: pointer; min-width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; }
    .tb-btn:hover { background: #e2e8f0; }
    .tb-btn-img { background: #eff6ff; border-color: #93c5fd; color: #1d4ed8; font-weight: 600; }
    .tb-btn-img:hover { background: #dbeafe; }
    .tb-select { padding: 3px 6px; font-size: 13px; border: 1px solid #cbd5e1; border-radius: 5px; height: 28px; background: #fff; cursor: pointer; width: auto; }
    .swatch-btn { width: 20px; height: 20px; border-radius: 4px; border: 1px solid #94a3b8; cursor: pointer; padding: 0; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; transition: transform 0.1s; }
    .swatch-btn:hover { transform: scale(1.15); border-color: #0f172a; }
    .color-picker-wrap { display: inline-flex; align-items: center; gap: 2px; background: #fff; border: 1px solid #cbd5e1; border-radius: 5px; padding: 1px 5px; height: 24px; font-size: 11px; color: #475569; cursor: pointer; }
    .color-picker-wrap input[type="color"] { border: none; width: 18px; height: 18px; padding: 0; background: none; cursor: pointer; }
    .table-tools { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 10px; background: #eff6ff; border-bottom: 1px solid #bfdbfe; font-size: 12px; align-items: center; }
    .table-tools button { background: #fff; border: 1px solid #93c5fd; color: #1d4ed8; border-radius: 4px; padding: 2px 8px; cursor: pointer; font-size: 12px; }
    .table-tools button:hover { background: #dbeafe; }
    .rich-editor-area { min-height: 260px; max-height: 560px; overflow-y: auto; padding: 14px 16px; outline: none; font-size: 15px; line-height: 1.7; }
    .rich-editor-area:empty:before { content: attr(data-placeholder); color: #94a3b8; pointer-events: none; }
    .rich-editor-area a { color: #2563eb; text-decoration: underline; }
    .rich-editor-area img { max-width: 100%; height: auto; border-radius: 8px; margin: 10px 0; display: block; border: 1px solid #cbd5e1; }
    .rich-editor-area table { width: 100%; border-collapse: collapse; margin: 12px 0; }
    .rich-editor-area th, .rich-editor-area td { border: 1px solid #94a3b8; padding: 8px 10px; min-width: 60px; }
    .rich-editor-area th { background: #f1f5f9; font-weight: 600; }

    .mini-modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,0.45); display: none; align-items: center; justify-content: center; z-index: 90; padding: 16px; }
    .mini-modal { background: #fff; padding: 20px 24px; border-radius: 12px; width: 100%; max-width: 360px; box-shadow: 0 12px 30px rgba(0,0,0,0.18); }
    .mini-modal h4 { margin: 0 0 14px; font-size: 16px; }
  </style>
</head>
<body>

  <div class="topbar">
    <strong>網站管理後台</strong>
    <div>
      <a href="./index.html">← 返回首頁</a>
      <button id="logout-btn" style="display:none; margin-left:8px;" onclick="logout()">登出</button>
    </div>
  </div>

  <!-- 1. 初次設定密碼畫面 -->
  <div id="setup-view" class="auth-box" style="display:none;">
    <h2>設定管理員密碼</h2>
    <p style="font-size:13px; color:#64748b;">系統會使用你設定的密碼將 GitHub Token 加密保存，之後登入只需輸入自訂密碼。</p>
    <div class="form-group">
      <label>GitHub Fine-grained Token（只需輸入這一次）</label>
      <input type="password" id="setup-token" placeholder="github_pat_..." />
    </div>
    <div class="form-group">
      <label>設定你的自訂管理員密碼</label>
      <input type="password" id="setup-pwd" placeholder="請輸入好記的密碼" />
    </div>
    <div class="form-group">
      <label>再次確認密碼</label>
      <input type="password" id="setup-pwd2" placeholder="再輸入一次密碼" />
    </div>
    <button id="setup-btn" class="btn" style="width:100%;" onclick="setupPassword()">加密綁定並進入後台</button>
    <div id="setup-status" class="status"></div>
    <span id="back-to-login-link" class="link-switch" style="display:none;" onclick="showView('login-view')">返回密碼登入</span>
  </div>

  <!-- 2. 管理員密碼登入畫面 -->
  <div id="login-view" class="auth-box" style="display:none;">
    <h2>管理員登入</h2>
    <div class="form-group">
      <label>請輸入管理員密碼</label>
      <input type="password" id="login-pwd" placeholder="輸入你設定的密碼" onkeydown="if(event.key==='Enter') loginWithPassword()" />
    </div>
    <button id="login-btn" class="btn" style="width:100%;" onclick="loginWithPassword()">登入</button>
    <div id="login-status" class="status"></div>
    <span class="link-switch" onclick="switchToReset()">忘記密碼或要更換 Token？重新設定</span>
  </div>

  <!-- 3. 管理後台主介面 -->
  <div id="dashboard-view" class="dashboard">

    <!-- 匿名小建議信箱 -->
    <div class="panel">
      <h3>
        <span>💬 匿名小建議信箱 <span id="sug-count-badge" class="sug-badge" style="font-size:12px; margin-left:4px;">0</span></span>
        <button type="button" class="btn btn-sm btn-secondary" onclick="loadSuggestions()">重新整理</button>
      </h3>
      <div id="suggestion-list">
        <p style="color:#64748b; font-size:14px; margin:0;">載入中...</p>
      </div>

      <details id="sug-settings-details" style="margin-top:16px;">
        <summary style="cursor:pointer; font-size:13px; font-weight:600; color:#2563eb;">⚙️ 建議箱接收設定（首次啟用請展開設定）</summary>
        <div class="sug-config-box">
          <div style="margin-bottom:10px;">
            <strong>1. 你的專屬讀取密鑰：</strong>
            <span id="admin-sug-key" class="key-pill">計算中...</span>
            <button type="button" class="btn btn-sm btn-secondary" style="margin-left:6px;" onclick="copySugKey()">複製密鑰</button>
          </div>
          <div class="form-group" style="margin-bottom:8px;">
            <label>2. 貼上 Google Apps Script 網頁應用程式網址</label>
            <div style="display:flex; gap:8px;">
              <input type="url" id="cfg-sug-url" placeholder="https://script.google.com/macros/s/.../exec" />
              <button type="button" class="btn btn-sm" style="flex-shrink:0;" onclick="saveSuggestionUrl()">儲存網址</button>
            </div>
          </div>
        </div>
      </details>
    </div>
    
    <!-- 網站標題與分類管理 -->
    <div class="panel">
      <h3>網站標題與分類管理</h3>
      <div class="row">
        <div class="form-group">
          <label>網站主標題</label>
          <input type="text" id="cfg-title" />
        </div>
        <div class="form-group">
          <label>網站副標題（選填）</label>
          <input type="text" id="cfg-subtitle" />
        </div>
      </div>
      <button class="btn btn-sm" onclick="saveSiteInfo()">更新網站標題</button>

      <div style="margin-top:20px;">
        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:8px; color:#475569;">自訂分類（新增後會自動出現在首頁，點擊 × 可刪除）</label>
        <div id="category-tags" class="tag-list"></div>
        <div style="display:flex; gap:8px; max-width:360px;">
          <input type="text" id="new-category-input" placeholder="輸入新分類名稱..." onkeydown="if(event.key==='Enter') addCategory()" />
          <button class="btn btn-sm" onclick="addCategory()">新增分類</button>
        </div>
      </div>
    </div>

    <!-- 發布 / 編輯文章 -->
    <div class="panel" id="editor-panel">
      <h3 id="editor-heading">發布新文章</h3>
      <input type="hidden" id="edit-post-id" value="" />
      <div class="row">
        <div class="form-group">
          <label>文章分類</label>
          <select id="post-category"></select>
        </div>
        <div class="form-group">
          <label>文章標題</label>
          <input type="text" id="post-title" placeholder="輸入文章標題" />
        </div>
      </div>
      <div class="form-group">
        <label>首頁卡片封面主圖（選填，若要放多張筆記圖片請直接在下方內文點擊「🖼️ 插入圖片」）</label>
        <input type="file" id="post-image" accept="image/*" />
        <div id="current-image-hint" style="font-size:12px; color:#64748b; margin-top:4px; display:none;">
          目前已有封面圖 <label style="display:inline; font-weight:normal; cursor:pointer;"><input type="checkbox" id="remove-image-chk" /> 移除現有圖片</label>
        </div>
      </div>

      <div class="form-group">
        <label>文章與筆記內容（可一次多選插入多張圖片、支援截圖 Ctrl+V 直接貼上）</label>
        <div class="editor-wrapper" id="editor-wrapper">
          <div class="editor-toolbar">
            <div class="tb-group">
              <select class="tb-select" onchange="execFormatBlock(this.value); this.value='';" title="段落樣式">
                <option value="">段落樣式</option>
                <option value="P">一般內文</option>
                <option value="H2">大標題</option>
                <option value="H3">中標題</option>
              </select>
              <button type="button" class="tb-btn" onmousedown="event.preventDefault()" onclick="execCmd('bold')" title="粗體"><b>B</b></button>
              <button type="button" class="tb-btn" onmousedown="event.preventDefault()" onclick="execCmd('italic')" title="斜體"><i>I</i></button>
              <button type="button" class="tb-btn" onmousedown="event.preventDefault()" onclick="execCmd('underline')" title="底線"><u>U</u></button>
              <button type="button" class="tb-btn" onmousedown="event.preventDefault()" onclick="execCmd('strikeThrough')" title="刪除線"><s>S</s></button>
            </div>

            <div class="tb-group">
              <span class="tb-label">字色:</span>
              <button type="button" class="swatch-btn" style="background:#dc2626;" onmousedown="event.preventDefault()" onclick="execCmd('foreColor', '#dc2626')" title="紅色字"></button>
              <button type="button" class="swatch-btn" style="background:#2563eb;" onmousedown="event.preventDefault()" onclick="execCmd('foreColor', '#2563eb')" title="藍色字"></button>
              <button type="button" class="swatch-btn" style="background:#16a34a;" onmousedown="event.preventDefault()" onclick="execCmd('foreColor', '#16a34a')" title="綠色字"></button>
              <button type="button" class="swatch-btn" style="background:#d97706;" onmousedown="event.preventDefault()" onclick="execCmd('foreColor', '#d97706')" title="橘色字"></button>
              <button type="button" class="swatch-btn" style="background:#7c3aed;" onmousedown="event.preventDefault()" onclick="execCmd('foreColor', '#7c3aed')" title="紫色字"></button>
              <button type="button" class="swatch-btn" style="background:#1e293b;" onmousedown="event.preventDefault()" onclick="execCmd('foreColor', '#1e293b')" title="預設深黑字"></button>
              <label class="color-picker-wrap" title="自訂文字顏色">
                <span>自訂</span>
                <input type="color" id="fore-color-input" value="#dc2626" oninput="execCmd('foreColor', this.value)" onchange="execCmd('foreColor', this.value)" />
              </label>
            </div>

            <div class="tb-group">
              <span class="tb-label">底色:</span>
              <button type="button" class="swatch-btn" style="background:#fef08a;" onmousedown="event.preventDefault()" onclick="execCmd('hiliteColor', '#fef08a')" title="黃色螢光底"></button>
              <button type="button" class="swatch-btn" style="background:#bbf7d0;" onmousedown="event.preventDefault()" onclick="execCmd('hiliteColor', '#bbf7d0')" title="綠色螢光底"></button>
              <button type="button" class="swatch-btn" style="background:#fbcfe8;" onmousedown="event.preventDefault()" onclick="execCmd('hiliteColor', '#fbcfe8')" title="粉色螢光底"></button>
              <button type="button" class="swatch-btn" style="background:#ffffff; color:#64748b;" onmousedown="event.preventDefault()" onclick="execCmd('hiliteColor', 'transparent')" title="清除底色">✕</button>
              <label class="color-picker-wrap" title="自訂底色">
                <span>自訂</span>
                <input type="color" id="hilite-color-input" value="#fef08a" oninput="execCmd('hiliteColor', this.value)" onchange="execCmd('hiliteColor', this.value)" />
              </label>
            </div>

            <div class="tb-group">
              <button type="button" class="tb-btn" onmousedown="event.preventDefault()" onclick="execCmd('justifyLeft')" title="靠左對齊">≡左</button>
              <button type="button" class="tb-btn" onmousedown="event.preventDefault()" onclick="execCmd('justifyCenter')" title="置中對齊">≡中</button>
              <button type="button" class="tb-btn" onmousedown="event.preventDefault()" onclick="execCmd('justifyRight')" title="靠右對齊">≡右</button>
              <button type="button" class="tb-btn" onmousedown="event.preventDefault()" onclick="execCmd('insertUnorderedList')" title="項目符號">• 清單</button>
              <button type="button" class="tb-btn" onmousedown="event.preventDefault()" onclick="execCmd('insertOrderedList')" title="編號清單">1. 清單</button>
            </div>

            <div class="tb-group">
              <button type="button" class="tb-btn tb-btn-img" onmousedown="event.preventDefault()" onclick="triggerInlineImageUpload()" title="一次選取並插入多張圖片">🖼️ 插入圖片</button>
              <button type="button" class="tb-btn" onmousedown="event.preventDefault()" onclick="openLinkModal()" title="在文中插入超連結">🔗 插入連結</button>
              <button type="button" class="tb-btn" onmousedown="event.preventDefault()" onclick="openTableModal()" title="插入表格">📊 插入表格</button>
              <button type="button" class="tb-btn" onmousedown="event.preventDefault()" onclick="execCmd('removeFormat')" title="清除選取文字格式">清除格式</button>
            </div>
          </div>

          <!-- 隱藏的多圖上傳輸入框 -->
          <input type="file" id="inline-image-input" accept="image/*" multiple style="display:none;" onchange="handleInlineImages(this.files); this.value='';" />

          <div class="table-tools" id="table-tools-bar" style="display:none;">
            <strong>表格調整：</strong>
            <button type="button" onmousedown="event.preventDefault()" onclick="tableAddRow()">+ 下方加一列</button>
            <button type="button" onmousedown="event.preventDefault()" onclick="tableAddCol()">+ 右側加一欄</button>
            <button type="button" onmousedown="event.preventDefault()" onclick="tableDelRow()">- 刪除此列</button>
            <button type="button" onmousedown="event.preventDefault()" onclick="tableDelCol()">- 刪除此欄</button>
          </div>
          <div id="post-editor" class="rich-editor-area" contenteditable="true" data-placeholder="在此輸入筆記或文章內容，可點上方「🖼️ 插入圖片」一次多選照片，或直接按 Ctrl+V 貼上截圖..."></div>
        </div>
      </div>

      <details style="margin-bottom:16px; font-size:13px; color:#64748b;">
        <summary style="cursor:pointer; font-weight:600;">文末獨立按鈕連結（選填，亦可直接在上方內文插入多個連結）</summary>
        <div class="row" style="margin-top:10px;">
          <div class="form-group" style="margin-bottom:0;">
            <label>按鈕文字</label>
            <input type="text" id="post-link-text" placeholder="例如：查看完整講義 PDF" />
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label>按鈕網址</label>
            <input type="url" id="post-link-url" placeholder="https://..." />
          </div>
        </div>
      </details>

      <button id="publish-btn" class="btn" onclick="submitPost()">發布文章</button>
      <button id="cancel-edit-btn" class="btn btn-secondary" style="display:none; margin-left:8px;" onclick="resetPostForm()">取消編輯</button>
    </div>

    <!-- 已發布文章列表 -->
    <div class="panel">
      <h3>已發布文章管理</h3>
      <div id="admin-post-list"></div>
    </div>

  </div>

  <!-- 插入連結小視窗 -->
  <div id="link-modal" class="mini-modal-bg" onclick="if(event.target===this) closeMiniModal('link-modal')">
    <div class="mini-modal">
      <h4>插入超連結</h4>
      <div class="form-group">
        <label>顯示文字</label>
        <input type="text" id="modal-link-text" placeholder="例如：點此查看資料" />
      </div>
      <div class="form-group">
        <label>連結網址 (URL)</label>
        <input type="url" id="modal-link-url" placeholder="https://..." />
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button type="button" class="btn btn-secondary btn-sm" onclick="closeMiniModal('link-modal')">取消</button>
        <button type="button" class="btn btn-sm" onclick="confirmInsertLink()">插入</button>
      </div>
    </div>
  </div>

  <!-- 插入表格小視窗 -->
  <div id="table-modal" class="mini-modal-bg" onclick="if(event.target===this) closeMiniModal('table-modal')">
    <div class="mini-modal">
      <h4>插入表格</h4>
      <div class="row">
        <div class="form-group">
          <label>列數 (橫向幾列)</label>
          <input type="text" id="modal-table-rows" value="3" />
        </div>
        <div class="form-group">
          <label>欄數 (直向幾欄)</label>
          <input type="text" id="modal-table-cols" value="3" />
        </div>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button type="button" class="btn btn-secondary btn-sm" onclick="closeMiniModal('table-modal')">取消</button>
        <button type="button" class="btn btn-sm" onclick="confirmInsertTable()">建立表格</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const CONFIG = {
      owner: 'ptuucd',
      repo: 'create-by-hyj',
      branch: 'main'
    };
    const API_BASE = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}`;
    const CACHE_KEY = 'hyj_encrypted_auth_v2';

    let activeToken = '';
    let currentEncryptedToken = '';
    let suggestionReadKey = '';
    let siteData = { siteTitle: '我的網站', siteSubtitle: '', suggestionApiUrl: '', encryptedToken: '', encryptedUpdatedAt: 0, categories: [], posts: [] };
    let savedRange = null;
    let isUploadingInlineImages = false;

    // === 富文本編輯器游標與指令控制 ===
    const editorEl = document.getElementById('post-editor');
    const wrapperEl = document.getElementById('editor-wrapper');

    function saveSelection() {
      const sel = window.getSelection();
      if (sel.rangeCount > 0) {
        const range = sel.getRangeAt(0);
        if (editorEl.contains(range.commonAncestorContainer)) {
          savedRange = range.cloneRange();
        }
      }
      updateTableToolbarVisibility();
    }

    function restoreSelection() {
      editorEl.focus();
      if (savedRange) {
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(savedRange);
      }
    }

    document.addEventListener('selectionchange', () => {
      if (document.activeElement === editorEl) {
        saveSelection();
      }
    });
    editorEl.addEventListener('mouseup', saveSelection);
    editorEl.addEventListener('keyup', saveSelection);
    editorEl.addEventListener('focus', updateTableToolbarVisibility);

    // === 支援多圖上傳、Ctrl+V 貼上截圖、拖曳圖片 ===
    function triggerInlineImageUpload() {
      saveSelection();
      document.getElementById('inline-image-input').click();
    }

    // 監聽 Ctrl+V 貼上圖片
    editorEl.addEventListener('paste', (e) => {
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      const imageFiles = [];
      for (const item of items) {
        if (item.kind === 'file' && item.type.startsWith('image/')) {
          const f = item.getAsFile();
          if (f) imageFiles.push(f);
        }
      }
      if (imageFiles.length > 0) {
        e.preventDefault();
        saveSelection();
        handleInlineImages(imageFiles);
      }
    });

    // 監聽拖曳圖片進編輯區
    wrapperEl.addEventListener('dragover', (e) => {
      e.preventDefault();
      wrapperEl.classList.add('drag-over');
    });
    wrapperEl.addEventListener('dragleave', () => {
      wrapperEl.classList.remove('drag-over');
    });
    wrapperEl.addEventListener('drop', (e) => {
      wrapperEl.classList.remove('drag-over');
      const files = e.dataTransfer && e.dataTransfer.files;
      if (files && files.length > 0) {
        const imageFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
        if (imageFiles.length > 0) {
          e.preventDefault();
          editorEl.focus();
          saveSelection();
          handleInlineImages(imageFiles);
        }
      }
    });

    async function uploadSingleImageToGitHub(file) {
      const compressedB64 = await compressImageToBase64(file);
      const ym = new Date().toISOString().slice(0, 7); // 例如 2026-11，自動按月份分資料夾
      const uniqueId = Date.now() + '_' + Math.random().toString(36).slice(2, 6);
      const imgPath = `images/${ym}/img_${uniqueId}.jpg`;

      const imgRes = await fetch(`${API_BASE}/contents/${imgPath}`, {
        method: 'PUT',
        headers: { 'Authorization': `Bearer ${activeToken}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: `Upload ${imgPath}`,
          content: compressedB64,
          branch: CONFIG.branch
        })
      });
      if (!imgRes.ok) {
        const errInfo = await imgRes.json().catch(() => ({}));
        throw new Error(errInfo.message || '圖片上傳失敗');
      }
      return imgPath;
    }

    async function handleInlineImages(fileList) {
      const files = Array.from(fileList || []).filter(f => f.type.startsWith('image/'));
      if (files.length === 0) return;
      if (isUploadingInlineImages) {
        showToast('尚有圖片正在上傳中，請稍候...');
        return;
      }

      isUploadingInlineImages = true;
      const pubBtn = document.getElementById('publish-btn');
      const prevBtnText = pubBtn.textContent;
      pubBtn.disabled = true;
      pubBtn.textContent = '圖片上傳中...';

      let successCount = 0;
      try {
        for (let i = 0; i < files.length; i++) {
          showToast(`正在壓縮並上傳第 ${i + 1} / ${files.length} 張圖片...`);
          const ghPath = await uploadSingleImageToGitHub(files[i]);
          const localPreviewUrl = URL.createObjectURL(files[i]);

          restoreSelection();

          const img = document.createElement('img');
          img.src = localPreviewUrl; // 立即在編輯區預覽，不需等待 GitHub Pages 部署
          img.setAttribute('data-gh-src', ghPath);
          img.alt = '筆記圖片';

          const pAfter = document.createElement('p');
          pAfter.innerHTML = '<br>';

          const sel = window.getSelection();
          if (sel.rangeCount > 0 && editorEl.contains(sel.getRangeAt(0).commonAncestorContainer)) {
            const range = sel.getRangeAt(0);
            range.deleteContents();
            range.insertNode(pAfter);
            range.insertNode(img);
            range.setStart(pAfter, 0);
            range.collapse(true);
            sel.removeAllRanges();
            sel.addRange(range);
          } else {
            editorEl.appendChild(img);
            editorEl.appendChild(pAfter);
          }

          saveSelection();
          successCount++;
        }
        showToast(`已成功插入 ${successCount} 張圖片！`);
      } catch (err) {
        alert(`圖片上傳中斷（已成功 ${successCount} 張）：${err.message}`);
      } finally {
        isUploadingInlineImages = false;
        pubBtn.disabled = false;
        pubBtn.textContent = document.getElementById('edit-post-id').value ? '儲存修改' : '發布文章';
      }
    }

    // 儲存前把暫時預覽的 blob 網址轉回正式的 GitHub 相對路徑
    function getCleanEditorHtml() {
      const clone = editorEl.cloneNode(true);
      clone.querySelectorAll('img[data-gh-src]').forEach(img => {
        img.setAttribute('src', img.getAttribute('data-gh-src'));
        img.removeAttribute('data-gh-src');
      });
      return clone.innerHTML.trim();
    }

    function execCmd(cmd, val = null) {
      restoreSelection();
      try {
        document.execCommand('styleWithCSS', false, true);
      } catch (e) {}
      document.execCommand(cmd, false, val);
      saveSelection();
    }

    function execFormatBlock(tag) {
      if (!tag) return;
      restoreSelection();
      document.execCommand('formatBlock', false, tag);
      saveSelection();
    }

    function openLinkModal() {
      saveSelection();
      const selectedText = savedRange ? savedRange.toString() : '';
      document.getElementById('modal-link-text').value = selectedText;
      document.getElementById('modal-link-url').value = '';
      document.getElementById('link-modal').style.display = 'flex';
      setTimeout(() => document.getElementById(selectedText ? 'modal-link-url' : 'modal-link-text').focus(), 50);
    }

    function confirmInsertLink() {
      const text = document.getElementById('modal-link-text').value.trim();
      let url = document.getElementById('modal-link-url').value.trim();
      if (!url) { alert('請輸入連結網址！'); return; }
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      const displayText = text || url;

      closeMiniModal('link-modal');
      restoreSelection();

      const a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = displayText;

      const sel = window.getSelection();
      if (sel.rangeCount > 0) {
        const range = sel.getRangeAt(0);
        range.deleteContents();
        const space = document.createTextNode('\u00A0');
        range.insertNode(space);
        range.insertNode(a);
        range.setStartAfter(space);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
      } else {
        editorEl.appendChild(a);
      }
      saveSelection();
    }

    function openTableModal() {
      saveSelection();
      document.getElementById('table-modal').style.display = 'flex';
    }

    function confirmInsertTable() {
      const rows = Math.max(1, Math.min(30, parseInt(document.getElementById('modal-table-rows').value) || 3));
      const cols = Math.max(1, Math.min(15, parseInt(document.getElementById('modal-table-cols').value) || 3));
      closeMiniModal('table-modal');
      restoreSelection();

      let html = '<table><thead><tr>';
      for (let c = 0; c < cols; c++) html += `<th>標題 ${c + 1}</th>`;
      html += '</tr></thead><tbody>';
      for (let r = 1; r < rows; r++) {
        html += '<tr>';
        for (let c = 0; c < cols; c++) html += '<td>內容</td>';
        html += '</tr>';
      }
      html += '</tbody></table><p><br></p>';

      document.execCommand('insertHTML', false, html);
      saveSelection();
    }

    function getActiveTableCell() {
      const sel = window.getSelection();
      if (!sel.rangeCount) return null;
      const node = sel.anchorNode.nodeType === 3 ? sel.anchorNode.parentElement : sel.anchorNode;
      return node ? node.closest('td, th') : null;
    }

    function updateTableToolbarVisibility() {
      const cell = getActiveTableCell();
      document.getElementById('table-tools-bar').style.display = cell && editorEl.contains(cell) ? 'flex' : 'none';
    }

    function tableAddRow() {
      const cell = getActiveTableCell();
      if (!cell) return;
      const tr = cell.parentElement;
      const table = tr.closest('table');
      const colCount = tr.children.length;
      const newTr = document.createElement('tr');
      for (let i = 0; i < colCount; i++) {
        const td = document.createElement('td');
        td.textContent = '內容';
        newTr.appendChild(td);
      }
      if (tr.parentElement.tagName === 'THEAD') {
        const tbody = table.querySelector('tbody') || table;
        tbody.insertBefore(newTr, tbody.firstChild);
      } else {
        tr.after(newTr);
      }
    }

    function tableAddCol() {
      const cell = getActiveTableCell();
      if (!cell) return;
      const colIdx = Array.from(cell.parentElement.children).indexOf(cell);
      const table = cell.closest('table');
      table.querySelectorAll('tr').forEach(tr => {
        const isHeader = tr.parentElement.tagName === 'THEAD';
        const newCell = document.createElement(isHeader ? 'th' : 'td');
        newCell.textContent = isHeader ? '新標題' : '內容';
        const refCell = tr.children[colIdx];
        if (refCell) refCell.after(newCell);
        else tr.appendChild(newCell);
      });
    }

    function tableDelRow() {
      const cell = getActiveTableCell();
      if (!cell) return;
      const tr = cell.parentElement;
      const table = tr.closest('table');
      if (table.querySelectorAll('tr').length <= 1) {
        table.remove();
      } else {
        tr.remove();
      }
      updateTableToolbarVisibility();
    }

    function tableDelCol() {
      const cell = getActiveTableCell();
      if (!cell) return;
      const tr = cell.parentElement;
      const table = tr.closest('table');
      if (tr.children.length <= 1) {
        table.remove();
      } else {
        const colIdx = Array.from(tr.children).indexOf(cell);
        table.querySelectorAll('tr').forEach(row => {
          if (row.children[colIdx]) row.children[colIdx].remove();
        });
      }
      updateTableToolbarVisibility();
    }

    function closeMiniModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    // === 加密 / 解密與 Base64 工具 ===
    function isValidBase64(str) {
      if (!str || typeof str !== 'string') return false;
      const clean = str.trim();
      if (clean.length < 40 || clean.length % 4 !== 0) return false;
      return /^[A-Za-z0-9+/]+={0,2}$/.test(clean);
    }

    function bufToB64(buf) {
      const bytes = new Uint8Array(buf);
      let bin = '';
      for (let i = 0; i < bytes.byteLength; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin);
    }

    function b64ToBuf(b64) {
      const clean = b64.trim();
      if (!isValidBase64(clean)) throw new Error('加密金鑰格式無效，請點下方「重新設定」');
      const bin = atob(clean);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    function utf8ToB64(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = '';
      for (let i = 0; i < bytes.byteLength; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin);
    }

    function b64ToUtf8(b64) {
      const clean = b64.replace(/\s/g, '');
      const bin = atob(clean);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    }

    async function computeSuggestionKey(token) {
      const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('sug_' + token));
      return Array.from(new Uint8Array(digest)).slice(0, 10).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function deriveKey(password, salt) {
      const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    }

    async function encryptToken(token, password) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveKey(password, salt);
      const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(token));
      const combined = new Uint8Array(16 + 12 + cipher.byteLength);
      combined.set(salt, 0);
      combined.set(iv, 16);
      combined.set(new Uint8Array(cipher), 28);
      return bufToB64(combined);
    }

    async function decryptToken(encryptedB64, password) {
      const combined = b64ToBuf(encryptedB64);
      const salt = combined.slice(0, 16);
      const iv = combined.slice(16, 28);
      const cipher = combined.slice(28);
      const key = await deriveKey(password, salt);
      const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, cipher);
      return new TextDecoder().decode(plainBuf);
    }

    // === 頁面狀態與驗證控制 ===
    function showView(viewId) {
      ['setup-view', 'login-view', 'dashboard-view'].forEach(id => {
        document.getElementById(id).style.display = id === viewId ? 'block' : 'none';
      });
      document.getElementById('logout-btn').style.display = viewId === 'dashboard-view' ? 'inline-block' : 'none';
    }

    async function initAuth() {
      let localAuth = null;
      try {
        localAuth = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      } catch (e) {}

      let remoteData = null;
      try {
        const res = await fetch(`./data.json?t=${Date.now()}`, { cache: 'no-store' });
        if (res.ok) remoteData = await res.json();
      } catch (e) {}

      const remoteValid = remoteData && isValidBase64(remoteData.encryptedToken);
      const localValid = localAuth && isValidBase64(localAuth.encryptedToken);

      if (remoteValid && localValid) {
        if ((remoteData.encryptedUpdatedAt || 0) >= (localAuth.encryptedUpdatedAt || 0)) {
          currentEncryptedToken = remoteData.encryptedToken.trim();
          localStorage.setItem(CACHE_KEY, JSON.stringify({
            encryptedToken: currentEncryptedToken,
            encryptedUpdatedAt: remoteData.encryptedUpdatedAt || Date.now()
          }));
        } else {
          currentEncryptedToken = localAuth.encryptedToken.trim();
        }
      } else if (remoteValid) {
        currentEncryptedToken = remoteData.encryptedToken.trim();
        localStorage.setItem(CACHE_KEY, JSON.stringify({
          encryptedToken: currentEncryptedToken,
          encryptedUpdatedAt: remoteData.encryptedUpdatedAt || Date.now()
        }));
      } else if (localValid) {
        currentEncryptedToken = localAuth.encryptedToken.trim();
      }

      const sessionToken = sessionStorage.getItem('gh_unlocked_token');
      if (sessionToken) {
        activeToken = sessionToken;
        enterDashboard();
        return;
      }

      if (isValidBase64(currentEncryptedToken)) {
        showView('login-view');
      } else {
        showView('setup-view');
      }
    }

    function switchToReset() {
      if (isValidBase64(currentEncryptedToken)) {
        document.getElementById('back-to-login-link').style.display = 'inline-block';
      }
      showView('setup-view');
    }

    async function setupPassword() {
      const token = document.getElementById('setup-token').value.trim();
      const pwd = document.getElementById('setup-pwd').value;
      const pwd2 = document.getElementById('setup-pwd2').value;
      const statusEl = document.getElementById('setup-status');
      const btn = document.getElementById('setup-btn');

      if (!token || !pwd) { statusEl.style.color = '#dc2626'; statusEl.textContent = '請完整填寫 Token 與自訂密碼。'; return; }
      if (pwd !== pwd2) { statusEl.style.color = '#dc2626'; statusEl.textContent = '兩次輸入的密碼不一致。'; return; }

      btn.disabled = true;
      statusEl.style.color = '#2563eb';
      statusEl.textContent = '正在驗證 Token 並儲存密碼設定...';

      try {
        const repoRes = await fetch(API_BASE, { headers: { 'Authorization': `Bearer ${token}` } });
        const repoData = await repoRes.json();
        if (!repoRes.ok || (repoData.permissions && !repoData.permissions.push)) {
          throw new Error('Token 無效或沒有讀寫權限');
        }

        const encryptedStr = await encryptToken(token, pwd);
        const now = Date.now();
        currentEncryptedToken = encryptedStr;
        localStorage.setItem(CACHE_KEY, JSON.stringify({
          encryptedToken: encryptedStr,
          encryptedUpdatedAt: now
        }));

        const fileRes = await fetch(`${API_BASE}/contents/data.json?ref=${CONFIG.branch}&t=${Date.now()}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const fileMeta = await fileRes.json();
        const existingData = JSON.parse(b64ToUtf8(fileMeta.content));

        existingData.encryptedToken = encryptedStr;
        existingData.encryptedUpdatedAt = now;
        if (!Array.isArray(existingData.categories)) existingData.categories = [];
        if (!Array.isArray(existingData.posts)) existingData.posts = [];

        const putRes = await fetch(`${API_BASE}/contents/data.json`, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: 'Save encrypted admin token',
            content: utf8ToB64(JSON.stringify(existingData, null, 2)),
            sha: fileMeta.sha,
            branch: CONFIG.branch
          })
        });
        if (!putRes.ok) throw new Error('寫入 data.json 失敗');

        activeToken = token;
        siteData = existingData;
        sessionStorage.setItem('gh_unlocked_token', token);
        statusEl.textContent = '';
        showToast('密碼設定成功！之後直接輸入自訂密碼即可登入。');
        enterDashboard(true);
      } catch (err) {
        statusEl.style.color = '#dc2626';
        statusEl.textContent = `設定失敗：${err.message}`;
      } finally {
        btn.disabled = false;
      }
    }

    async function loginWithPassword() {
      const pwd = document.getElementById('login-pwd').value;
      const statusEl = document.getElementById('login-status');
      const btn = document.getElementById('login-btn');
      if (!pwd) return;

      btn.disabled = true;
      statusEl.style.color = '#2563eb';
      statusEl.textContent = '正在驗證密碼...';

      try {
        const token = await decryptToken(currentEncryptedToken, pwd);
        const res = await fetch(API_BASE, { headers: { 'Authorization': `Bearer ${token}` } });
        if (!res.ok) throw new Error('Token 已失效，請點下方「重新設定」');

        activeToken = token;
        sessionStorage.setItem('gh_unlocked_token', token);
        statusEl.textContent = '';
        enterDashboard();
      } catch (err) {
        statusEl.style.color = '#dc2626';
        statusEl.textContent = err.name === 'OperationError' ? '管理員密碼錯誤！' : err.message;
      } finally {
        btn.disabled = false;
      }
    }

    function logout() {
      sessionStorage.removeItem('gh_unlocked_token');
      activeToken = '';
      document.getElementById('login-pwd').value = '';
      showView('login-view');
    }

    // === 後台資料讀寫 ===
    async function enterDashboard(skipFetch = false) {
      showView('dashboard-view');
      suggestionReadKey = await computeSuggestionKey(activeToken);
      document.getElementById('admin-sug-key').textContent = suggestionReadKey;

      if (skipFetch) {
        syncFormFromData();
      } else {
        await loadSiteData();
      }
    }

    async function loadSiteData() {
      try {
        const res = await fetch(`${API_BASE}/contents/data.json?ref=${CONFIG.branch}&t=${Date.now()}`, {
          headers: { 'Authorization': `Bearer ${activeToken}` }
        });
        const meta = await res.json();
        siteData = JSON.parse(b64ToUtf8(meta.content));
      } catch (e) {
        const res = await fetch(`./data.json?t=${Date.now()}`, { cache: 'no-store' });
        siteData = await res.json();
      }
      syncFormFromData();
    }

    function syncFormFromData() {
      document.getElementById('cfg-title').value = siteData.siteTitle || '';
      document.getElementById('cfg-subtitle').value = siteData.siteSubtitle || '';
      document.getElementById('cfg-sug-url').value = siteData.suggestionApiUrl || '';
      if (!siteData.suggestionApiUrl) {
        document.getElementById('sug-settings-details').open = true;
      }
      renderAdminCategories();
      renderAdminPosts();
      loadSuggestions();
    }

    async function commitDataJson(commitMsg) {
      const getRes = await fetch(`${API_BASE}/contents/data.json?ref=${CONFIG.branch}&t=${Date.now()}`, {
        headers: { 'Authorization': `Bearer ${activeToken}` }
      });
      const meta = await getRes.json();
      const latestRemote = JSON.parse(b64ToUtf8(meta.content));

      if (!siteData.encryptedToken) {
        siteData.encryptedToken = latestRemote.encryptedToken || currentEncryptedToken || '';
      }
      if (!siteData.encryptedUpdatedAt && latestRemote.encryptedUpdatedAt) {
        siteData.encryptedUpdatedAt = latestRemote.encryptedUpdatedAt;
      }

      const putRes = await fetch(`${API_BASE}/contents/data.json`, {
        method: 'PUT',
        headers: { 'Authorization': `Bearer ${activeToken}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: commitMsg,
          content: utf8ToB64(JSON.stringify(siteData, null, 2)),
          sha: meta.sha,
          branch: CONFIG.branch
        })
      });
      if (!putRes.ok) throw new Error('儲存資料失敗');
      showToast('已成功儲存！（首頁約 30 秒～1 分鐘完成更新）');
    }

    // === 匿名小建議讀取與管理 ===
    function copySugKey() {
      navigator.clipboard.writeText(suggestionReadKey);
      showToast('已複製專屬讀取密鑰！');
    }

    async function saveSuggestionUrl() {
      const url = document.getElementById('cfg-sug-url').value.trim();
      siteData.suggestionApiUrl = url;
      await commitDataJson('Update suggestion API URL');
      loadSuggestions();
    }

    async function loadSuggestions() {
      const listEl = document.getElementById('suggestion-list');
      const badgeEl = document.getElementById('sug-count-badge');
      const apiUrl = (siteData.suggestionApiUrl || '').trim();

      if (!apiUrl) {
        badgeEl.textContent = '0';
        listEl.innerHTML = '<p style="color:#64748b; font-size:13px; margin:0;">尚未設定建議箱網址，請展開下方「⚙️ 建議箱接收設定」完成綁定。</p>';
        return;
      }

      listEl.innerHTML = '<p style="color:#64748b; font-size:13px; margin:0;">正在讀取匿名小建議...</p>';
      try {
        const sep = apiUrl.includes('?') ? '&' : '?';
        const res = await fetch(`${apiUrl}${sep}key=${encodeURIComponent(suggestionReadKey)}&t=${Date.now()}`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || '密鑰不符或讀取失敗');

        const items = data.items || [];
        badgeEl.textContent = items.length;
        if (items.length === 0) {
          listEl.innerHTML = '<p style="color:#64748b; font-size:14px; margin:0;">目前還沒有收到任何匿名小建議。</p>';
          return;
        }

        listEl.innerHTML = items.map(item => `
          <div class="sug-card" id="sug-card-${escapeHtml(item.id)}">
            <div style="flex:1;">
              <div class="sug-meta">
                <span class="sug-badge">${escapeHtml(item.tag)}</span>
                <span>${escapeHtml(item.createdAt)}</span>
              </div>
              <div class="sug-text">${escapeHtml(item.content)}</div>
            </div>
            <button type="button" class="btn btn-sm btn-danger" style="flex-shrink:0;" onclick="deleteSuggestion('${escapeJs(item.id)}')">刪除</button>
          </div>
        `).join('');
      } catch (err) {
        listEl.innerHTML = `<p style="color:#dc2626; font-size:13px; margin:0;">讀取失敗：${escapeHtml(err.message)}</p>`;
      }
    }

    async function deleteSuggestion(id) {
      if (!confirm('確定要刪除這則小建議嗎？')) return;
      const apiUrl = (siteData.suggestionApiUrl || '').trim();
      try {
        const res = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'delete', key: suggestionReadKey, id })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || '刪除失敗');
        showToast('已刪除該則建議');
        loadSuggestions();
      } catch (err) {
        alert('刪除失敗：' + err.message);
      }
    }

    async function saveSiteInfo() {
      siteData.siteTitle = document.getElementById('cfg-title').value.trim();
      siteData.siteSubtitle = document.getElementById('cfg-subtitle').value.trim();
      await commitDataJson('Update site title');
    }

    function renderAdminCategories() {
      const tagsEl = document.getElementById('category-tags');
      const selectEl = document.getElementById('post-category');
      const cats = siteData.categories || [];

      tagsEl.innerHTML = cats.length > 0
        ? cats.map((c, idx) => `<span class="tag">${escapeHtml(c)} <button onclick="deleteCategory(${idx})" title="刪除分類">×</button></span>`).join('')
        : '<span style="color:#94a3b8; font-size:13px;">目前尚無分類，請在下方新增</span>';

      selectEl.innerHTML = '<option value="">未分類</option>' + cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    }

    async function addCategory() {
      const input = document.getElementById('new-category-input');
      const name = input.value.trim();
      if (!name) return;
      if (!siteData.categories) siteData.categories = [];
      if (siteData.categories.includes(name)) { showToast('此分類已存在'); return; }

      siteData.categories.push(name);
      input.value = '';
      renderAdminCategories();
      await commitDataJson(`Add category: ${name}`);
    }

    async function deleteCategory(idx) {
      const target = siteData.categories[idx];
      if (!confirm(`確定要刪除「${target}」分類嗎？`)) return;
      siteData.categories.splice(idx, 1);
      renderAdminCategories();
      await commitDataJson(`Delete category: ${target}`);
    }

    // === 文章發布 / 編輯 / 刪除 ===
    async function submitPost() {
      if (isUploadingInlineImages) {
        alert('請等待內文圖片上傳完成後再發布！');
        return;
      }

      const btn = document.getElementById('publish-btn');
      const editId = document.getElementById('edit-post-id').value;
      const category = document.getElementById('post-category').value;
      const title = document.getElementById('post-title').value.trim();
      const contentHtml = getCleanEditorHtml();
      const plainText = editorEl.textContent.trim();
      const hasMediaOrTable = editorEl.querySelector('table, img') !== null;
      const linkText = document.getElementById('post-link-text').value.trim();
      const linkUrl = document.getElementById('post-link-url').value.trim();
      const fileInput = document.getElementById('post-image');

      if (!title || (!plainText && !hasMediaOrTable)) { alert('請填寫文章標題與內容！'); return; }

      btn.disabled = true;
      btn.textContent = '處理中...';

      try {
        const existingPost = editId ? siteData.posts.find(p => p.id === editId) : null;
        let imageUrl = existingPost ? existingPost.imageUrl : '';

        if (document.getElementById('remove-image-chk').checked) {
          imageUrl = '';
        }

        if (fileInput.files.length > 0) {
          showToast('正在壓縮並上傳封面主圖...');
          imageUrl = await uploadSingleImageToGitHub(fileInput.files[0]);
        }

        if (existingPost) {
          Object.assign(existingPost, { category, title, content: contentHtml, imageUrl, linkText, linkUrl });
          await commitDataJson(`Edit post: ${title}`);
        } else {
          const today = new Date().toISOString().split('T')[0];
          siteData.posts.unshift({
            id: 'post_' + Date.now(),
            category, title, content: contentHtml, imageUrl, linkText, linkUrl,
            createdAt: today
          });
          await commitDataJson(`Publish post: ${title}`);
        }

        resetPostForm();
        renderAdminPosts();
      } catch (err) {
        alert(`發生錯誤：${err.message}`);
      } finally {
        btn.disabled = false;
        btn.textContent = document.getElementById('edit-post-id').value ? '儲存修改' : '發布文章';
      }
    }

    function editPost(id) {
      const post = siteData.posts.find(p => p.id === id);
      if (!post) return;
      document.getElementById('edit-post-id').value = post.id;
      document.getElementById('editor-heading').textContent = '編輯文章';
      document.getElementById('post-category').value = post.category || '';
      document.getElementById('post-title').value = post.title;

      const raw = String(post.content || '');
      const hasHtmlTag = /<(p|div|br|b|strong|i|em|u|s|strike|h[1-6]|ul|ol|li|span|font|a|img|table)\b/i.test(raw);
      editorEl.innerHTML = hasHtmlTag ? raw : escapeHtml(raw).replace(/\n/g, '<br>');

      document.getElementById('post-link-text').value = post.linkText || '';
      document.getElementById('post-link-url').value = post.linkUrl || '';
      document.getElementById('remove-image-chk').checked = false;
      document.getElementById('current-image-hint').style.display = post.imageUrl ? 'block' : 'none';
      document.getElementById('publish-btn').textContent = '儲存修改';
      document.getElementById('cancel-edit-btn').style.display = 'inline-block';
      document.getElementById('editor-panel').scrollIntoView({ behavior: 'smooth' });
    }

    function resetPostForm() {
      document.getElementById('edit-post-id').value = '';
      document.getElementById('editor-heading').textContent = '發布新文章';
      document.getElementById('post-title').value = '';
      editorEl.innerHTML = '';
      document.getElementById('table-tools-bar').style.display = 'none';
      document.getElementById('post-link-text').value = '';
      document.getElementById('post-link-url').value = '';
      document.getElementById('post-image').value = '';
      document.getElementById('current-image-hint').style.display = 'none';
      document.getElementById('publish-btn').textContent = '發布文章';
      document.getElementById('cancel-edit-btn').style.display = 'none';
    }

    async function deletePost(id) {
      const idx = siteData.posts.findIndex(p => p.id === id);
      if (idx === -1) return;
      if (!confirm(`確定要刪除「${siteData.posts[idx].title}」嗎？`)) return;
      const title = siteData.posts[idx].title;
      siteData.posts.splice(idx, 1);
      renderAdminPosts();
      await commitDataJson(`Delete post: ${title}`);
    }

    function renderAdminPosts() {
      const list = document.getElementById('admin-post-list');
      if (!siteData.posts || siteData.posts.length === 0) {
        list.innerHTML = '<p style="color:#64748b; font-size:14px;">目前尚未發布任何文章。</p>';
        return;
      }
      list.innerHTML = siteData.posts.map(p => `
        <div class="post-item">
          <div>
            ${p.category ? `<span class="tag" style="padding:2px 8px; font-size:12px;">${escapeHtml(p.category)}</span>` : ''}
            <strong style="margin-left:${p.category ? '6px' : '0'};">${escapeHtml(p.title)}</strong>
            <span style="color:#94a3b8; font-size:12px; margin-left:8px;">${escapeHtml(p.createdAt)}</span>
          </div>
          <div style="display:flex; gap:6px; flex-shrink:0;">
            <button class="btn btn-sm btn-secondary" onclick="editPost('${escapeJs(p.id)}')">編輯</button>
            <button class="btn btn-sm btn-danger" onclick="deletePost('${escapeJs(p.id)}')">刪除</button>
          </div>
        </div>
      `).join('');
    }

    function compressImageToBase64(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const maxW = 1200;
          const scale = img.width > maxW ? maxW / img.width : 1;
          const canvas = document.createElement('canvas');
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.82).split(',')[1]);
        };
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    function escapeJs(str) {
      return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 4000);
    }

    initAuth();
  </script>
</body>
